<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>GTANK 3D World — Prototype</title>
<style>
  :root { 
    --ink:#17232b; 
    --sub-ink:#3a525e;
    --glass:rgba(255,255,255,.72); 
    --line:rgba(255,255,255,.85); 
    --gold:#ffd36a; 
    --accent:#c87d12;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8dcbd4;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink)}
  #scene{position:fixed;inset:0}
  canvas{display:block}
  .topbar{position:fixed;z-index:5;left:22px;right:22px;top:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;pointer-events:none}
  .brand{pointer-events:auto;font-weight:900;letter-spacing:.08em;font-size:25px;line-height:1;color:#fff;text-shadow:0 2px 10px rgba(20,43,53,.35)}
  .brand small{display:block;font-size:10px;letter-spacing:.28em;margin-top:5px;color:#fff5d6}
  
  /* 頂部功能列：半透明淺色毛玻璃 */
  nav{pointer-events:auto;display:flex;gap:7px;padding:7px;border:1px solid var(--line);border-radius:16px;background:var(--glass);backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(18,45,56,.12)}
  nav button,.control{border:0;color:var(--ink);background:transparent;padding:10px 13px;border-radius:10px;font-weight:700;cursor:pointer;transition:.2s}
  nav button:hover,.control:hover{background:rgba(255,255,255,.75)}
  
  /* 左下角「操作方式」看板：半透明淺色毛玻璃 */
  .hint{position:fixed;left:22px;bottom:20px;z-index:4;padding:12px 16px;background:var(--glass);border:1px solid var(--line);border-radius:14px;font-size:12px;line-height:1.7;color:var(--sub-ink);backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(18,45,56,.12)}
  .hint b{color:var(--ink);font-weight:800}
  
  .side{position:fixed;right:22px;top:105px;z-index:4;width:230px;padding:16px;background:var(--glass);border:1px solid var(--line);border-radius:17px;backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(18,45,56,.12)}
  .side h3{margin:0 0 9px;font-size:14px;letter-spacing:.12em;color:var(--accent)}
  .side p{font-size:12px;line-height:1.65;color:var(--sub-ink);margin:0}
  .side .status{display:inline-block;margin-top:12px;padding:5px 9px;border-radius:20px;background:rgba(255,211,106,.35);color:var(--ink);font-size:11px;font-weight:700}
  
  /* 底部互動資訊彈窗：半透明淺色卡片 */
  .info{position:fixed;z-index:6;left:50%;bottom:22px;transform:translate(-50%,20px);width:min(460px,calc(100% - 32px));padding:18px 20px;background:rgba(255,255,255,.88);border:1px solid #fff;border-radius:18px;backdrop-filter:blur(16px);box-shadow:0 12px 32px rgba(18,45,56,.18);opacity:0;pointer-events:none;transition:.3s}
  .info.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .info .eyebrow{font-size:10px;letter-spacing:.2em;color:var(--accent);font-weight:800}
  .info h2{margin:5px 0 6px;font-size:21px;color:var(--ink)}
  .info p{margin:0;color:var(--sub-ink);font-size:13px;line-height:1.6}
  .info button{margin-top:13px;border:0;background:var(--gold);color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(200,125,18,.2)}
  .info button:hover{filter:brightness(1.03)}
  .close{position:absolute;right:13px;top:12px;background:rgba(23,35,43,.06)!important;color:var(--ink)!important;padding:4px 9px!important;box-shadow:none!important}
  .close:hover{background:rgba(23,35,43,.14)!important}
  
  .footer{position:fixed;right:22px;bottom:20px;z-index:4;color:rgba(255,255,255,.9);font-size:10px;letter-spacing:.12em;text-shadow:0 1px 4px rgba(20,43,53,.35)}
  #loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#18343d;color:#fff;transition:opacity .5s}
  #loading.hide{opacity:0;pointer-events:none}
  #loading div{text-align:center;letter-spacing:.18em;font-weight:800}
  #loading small{display:block;margin-top:10px;letter-spacing:.05em;font-weight:400;color:#b8d5d9}
  @media(max-width:760px){.topbar{left:12px;right:12px;top:12px;align-items:flex-start}.brand{font-size:19px}nav{max-width:70vw;overflow:auto}nav button{white-space:nowrap;padding:8px;font-size:11px}.side{top:auto;bottom:92px;right:12px;width:185px;padding:12px}.hint{left:12px;bottom:12px;max-width:calc(100% - 220px);font-size:10px}.footer{display:none}}
</style>
</head>

<script>
  window.addEventListener('error', (event) => {
    const loading = document.querySelector('#loading');
    if (loading) {
      loading.classList.remove('hide');
      loading.innerHTML = '<div>3D 場景載入失敗<small>' +
        (event.message || '請確認網路連線，並使用 VS Code Live Server 開啟。') +
        '</small></div>';
    }
  });
  window.addEventListener('unhandledrejection', (event) => {
    const loading = document.querySelector('#loading');
    if (loading) {
      loading.classList.remove('hide');
      loading.innerHTML = '<div>3D 模組載入失敗<small>' +
        String(event.reason || '請確認網路連線，並使用 VS Code Live Server 開啟。') +
        '</small></div>';
    }
  });
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import { GLTFExporter } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/exporters/GLTFExporter.js';

const mount=document.querySelector('#scene');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91cbd2);
scene.fog=new THREE.Fog(0x91cbd2,35,85);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,200);
camera.position.set(16,17,22);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
mount.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.06;
controls.minDistance=10; controls.maxDistance=48;
controls.maxPolarAngle=Math.PI*.48;
controls.target.set(0,1.2,0);

scene.add(new THREE.HemisphereLight(0xdffaff,0x60716c,2.1));
const sun=new THREE.DirectionalLight(0xffedcf,3.2);
sun.position.set(-12,24,12); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-30;sun.shadow.camera.right=30;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;scene.add(sun);

// 材質定義
const mat=(color,roughness=.75,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const birchFloor=mat(0xdcc3a1,.72);      // 場地木地板
const birchRamp=mat(0xd3b48c,.65);       // 道具木板主體
const birchSide=mat(0xbe9b6e,.78);       // 道具側板/深色木紋
const seamDark=mat(0x524336,.85);        // 板材伸縮縫
const darkMetal=mat(0x2d353a,.35,.75);   // 扶手與邊緣角鐵
const steelPlate=mat(0xa8b2b8,.3,.85);   // 斜坡底部銀色金屬過渡鐵板
const padBlue=mat(0x4a90a4,.6);          // 練習扶手防撞泡棉
const bumperYellow=mat(0xf2c94c,.5);     // 平台轉角黃色防撞護條
const white=mat(0xf4f2eb,.6);

const world=new THREE.Group();scene.add(world);
const pickables=[]; const floaters=[];

function box(parent,x,y,z,sx,sy,sz,material,cast=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);
  m.position.set(x,y,z);
  m.castShadow=cast;
  m.receiveShadow=true;
  parent.add(m);
  return m;
}
function cylinder(parent,x,y,z,r1,r2,h,material,segments=24){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material);
  m.position.set(x,y,z);
  m.castShadow=true;
  m.receiveShadow=true;
  parent.add(m);
  return m;
}

// 沿 Z 軸擠出剖面 (points 為 [x, y] 陣列)
function extrudeProfile(parent, points, width, x, y, z, material){
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for(let i=1; i<points.length; i++){
    shape.lineTo(points[i][0], points[i][1]);
  }
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: width, bevelEnabled: false });
  geo.translate(0, 0, -width/2);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// 建立帶垂直白色支撐腳柱的圓管扶手
function createRailWithPosts(parent, points, postIndices=[], radius=0.042, railMat=darkMetal, postMat=white){
  for(let i=0; i<points.length-1; i++){
    const v1 = new THREE.Vector3(...points[i]);
    const v2 = new THREE.Vector3(...points[i+1]);
    const dist = v1.distanceTo(v2);
    const geo = new THREE.CylinderGeometry(radius, radius, dist, 16);
    const mesh = new THREE.Mesh(geo, railMat);
    mesh.position.copy(v1).add(v2).multiplyScalar(0.5);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), v2.clone().sub(v1).normalize());
    mesh.castShadow = true;
    parent.add(mesh);
  }
  for(const idx of postIndices){
    const p = points[idx];
    const postH = 0.40;
    cylinder(parent, p[0], p[1] - postH/2, p[2], 0.03, 0.03, postH, postMat, 10);
  }
}

// GTANK TSK8 Logo 貼紙
function createGtankLogoDecal(w=1.4, h=1.0){
  const c=document.createElement('canvas'); c.width=256; c.height=180;
  const ctx=c.getContext('2d');
  ctx.fillStyle='rgba(255,255,255,0.88)';
  ctx.fillRect(10,10,236,160);
  ctx.strokeStyle='#222'; ctx.lineWidth=6; ctx.strokeRect(14,14,228,152);
  ctx.fillStyle='#1c2428'; ctx.font='900 32px sans-serif'; ctx.textAlign='center';
  ctx.fillText('GTANK', 128, 62);
  ctx.font='900 58px sans-serif';
  ctx.fillText('TSK8', 128, 128);
  const tex=new THREE.CanvasTexture(c);
  const geo=new THREE.PlaneGeometry(w,h);
  const matDecal=new THREE.MeshBasicMaterial({map:tex, transparent:true, polygonOffset:true, polygonOffsetFactor:-1});
  return new THREE.Mesh(geo, matDecal);
}

function islandBase(parent,x,z,rx,rz,topY=0.4,color=0x7da77c){
 const g=new THREE.Group();g.position.set(x,0,z);parent.add(g);
 const top=new THREE.Mesh(new THREE.CylinderGeometry(rx,rx*.88,.65,64),mat(color));top.position.y=topY-.15;top.castShadow=true;top.receiveShadow=true;g.add(top);
 const rock=new THREE.Mesh(new THREE.CylinderGeometry(rx*.88,rx*.65,1.45,10),mat(0x667d78));rock.position.y=topY-1.1;rock.castShadow=true;g.add(rock);
 for(let i=0;i<9;i++){const a=i/9*Math.PI*2;const b=new THREE.Mesh(new THREE.ConeGeometry(.48,.9,5),mat(i%2?0x637a76:0x718b80));b.position.set(Math.cos(a)*rx*.58,topY-1.65,Math.sin(a)*rz*.58);b.rotation.z=Math.PI;g.add(b)}
 return g;
}

function labelSprite(text,color='#ffffff'){
 const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');
 ctx.fillStyle='rgba(13,27,32,.82)';ctx.beginPath();ctx.roundRect(8,8,496,112,26);ctx.fill();
 ctx.strokeStyle=color;ctx.lineWidth=5;ctx.stroke();
 ctx.font='bold 42px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(text,256,65);
 const tex=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));s.scale.set(4.4,1.1,1);return s;
}

function addHotspot(group,x,y,z,title,tag,desc,color=0xffd36a){
 const orb=new THREE.Mesh(new THREE.SphereGeometry(.28,20,20),new THREE.MeshBasicMaterial({color}));orb.position.set(x,y,z);group.add(orb);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.52,.045,8,40),new THREE.MeshBasicMaterial({color}));ring.rotation.x=Math.PI/2;ring.position.set(x,y-.16,z);group.add(ring);
 const spr=labelSprite(title,'#'+new THREE.Color(color).getHexString());
 spr.position.set(x,y+0.95,z);
 spr.scale.set(3.6,0.9,1); // 讓所有熱點看板大小統一俐落
 group.add(spr);
 orb.userData={title,tag,desc};pickables.push(orb);pickables.push(spr);
 return orb;
}

// 海洋與波紋
const ocean=new THREE.Mesh(new THREE.CircleGeometry(42,96),new THREE.MeshStandardMaterial({color:0x4aabb8,roughness:.42,metalness:.12}));
ocean.rotation.x=-Math.PI/2;ocean.position.y=-2.6;ocean.receiveShadow=true;scene.add(ocean);
for(let i=0;i<4;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(12+i*5,.025,6,160),new THREE.MeshBasicMaterial({color:0xa4edf0,transparent:true,opacity:.22}));r.rotation.x=Math.PI/2;r.position.y=-2.45+i*.015;scene.add(r);}

// ============================================================================
// MAIN SKATEPARK ISLAND — 還原 活力天空 GTANK 滑板場真實配置
// ============================================================================
const main=islandBase(world,0,0,10.8,8.4,.45,0x83ad80);
main.userData.worldKey='main';
floaters.push({obj:main,base:0,amp:.08,speed:.7,phase:0});

const park=new THREE.Group();
main.add(park);
const floorY = 0.76; // 場地木地板表面高度

// 1. 場地基底與樺木地板
box(park, 0, 0.56, 0, 19.2, 0.28, 13.6, birchSide);
box(park, 0, 0.72, 0, 18.8, 0.08, 13.2, birchFloor, false);

// ----------------------------------------------------------------------------
// 2. 靠最內側 (-Z 側) 一字型長條組合道具 (Z 軸加寬至 4.8m，前緣 -1.05 對齊右側出發台斜坡接地線)
// 結構：z 從 -5.85 延伸至 -1.05 (中心 backLineZ = -3.45, 總寬度 backLineW = 4.8)
// ----------------------------------------------------------------------------
const backLineZ = -3.45;    // 中心 Z 座標 (z: -5.85 ~ -1.05)
const backLineW = 4.8;      // 依俯視圖標註往 +Z 加寬至 4.8m
const backLeftEdge = -9.2;  // 恢復靠齊場地最左側 (-X = -9.2)
const backPlatH = 0.88;     // 中央高平台高度
const backTopH = 2.05;      // 最左側弧面頂端高度
const backRailH = 0.40;     // 扶手高度

// 2A. 最左側弧面與中間斜坡三段式組合 (x: -9.2 ~ -6.2，朝向 +X 中央平台)
function buildLeftEndQuarter(parent, leftX, centerZ, widthZ, depthX, heightY, deckDepth=0.85){
  const shape = new THREE.Shape();
  const r = heightY - backPlatH;
  
  shape.moveTo(0, 0);
  shape.lineTo(deckDepth + depthX, 0);
  shape.lineTo(deckDepth + depthX, backPlatH);
  
  if (depthX > r) {
    shape.lineTo(deckDepth + r, backPlatH);
  }
  
  shape.absarc(deckDepth + r, backPlatH + r, r, -Math.PI / 2, Math.PI, true);
  shape.lineTo(deckDepth, heightY);
  shape.lineTo(0, heightY);
  shape.closePath();

  const geo = new THREE.ExtrudeGeometry(shape, { depth: widthZ, bevelEnabled: false, curveSegments: 24 });
  geo.translate(0, 0, -widthZ/2);
  const mesh = new THREE.Mesh(geo, birchRamp);
  mesh.position.set(leftX, floorY, centerZ);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);

  const coping = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, widthZ, 14), darkMetal);
  coping.rotation.x = Math.PI/2;
  coping.position.set(leftX + deckDepth, floorY + heightY, centerZ);
  parent.add(coping);
}

// 內側弧面 (寬 1.65)
buildLeftEndQuarter(park, backLeftEdge, backLineZ - 1.575, 1.65, 2.15, backTopH, 0.85);

// 中間直斜坡 (寬 1.50，銜接高台頂端至中央平台)
extrudeProfile(park, [
  [backLeftEdge, 0],
  [backLeftEdge, backTopH],
  [backLeftEdge + 0.85, backTopH],
  [backLeftEdge + 3.0, backPlatH],
  [backLeftEdge + 3.0, 0]
], 1.50, 0, floorY, backLineZ, birchRamp);

// 前側弧面 (寬 1.65)
buildLeftEndQuarter(park, backLeftEdge, backLineZ + 1.575, 1.65, 2.15, backTopH, 0.85);

// 2B. 中段加寬長平台 (x: -6.2 ~ +1.2，寬 4.8，高度 backPlatH = 0.88)
extrudeProfile(park, [
  [-6.2, 0],
  [-6.2, backPlatH],
  [ 1.2, backPlatH],
  [ 1.2, 0]
], backLineW, 0, floorY, backLineZ, birchRamp);

// 平台板材伸縮縫細節
for(const sx of [-3.8, -1.3]){
  box(park, sx, floorY + backPlatH + 0.005, backLineZ, 0.03, 0.01, backLineW, seamDark, false);
}

// 2C. 最右側三合一落差區 (x: +1.2 ~ +3.6，隨總寬度 4.8m 等比例加寬)
const rightDropStartX = 1.2;
const rightDropLen = 2.4;
const topFlatRailLen = 1.35;

// (1) 靠前側 (+Z 側)：大斜坡 + 置中下斜圓管扶手 (寬 2.05)
const frontSlopeW = 2.05;
const frontSlopeZ = backLineZ + backLineW/2 - frontSlopeW/2;
extrudeProfile(park, [
  [rightDropStartX, 0],
  [rightDropStartX, backPlatH],
  [rightDropStartX + rightDropLen, 0]
], frontSlopeW, 0, floorY, frontSlopeZ, birchRamp);
box(park, rightDropStartX + rightDropLen - 0.14, floorY + 0.012, frontSlopeZ, 0.30, 0.02, frontSlopeW, steelPlate);

createRailWithPosts(park, [
  [rightDropStartX - topFlatRailLen, floorY + backPlatH + backRailH, frontSlopeZ],
  [rightDropStartX - topFlatRailLen/2, floorY + backPlatH + backRailH, frontSlopeZ],
  [rightDropStartX, floorY + backPlatH + backRailH, frontSlopeZ],
  [rightDropStartX + rightDropLen, floorY + backRailH*0.85, frontSlopeZ]
], [0, 1, 2, 3]);

// (2) 正中央分隔：Flat-Down Hubba 平斜台 (寬 0.65)
extrudeProfile(park, [
  [rightDropStartX - 0.75, 0],
  [rightDropStartX - 0.75, backPlatH + 0.24],
  [rightDropStartX,        backPlatH + 0.24],
  [rightDropStartX + rightDropLen, 0.24],
  [rightDropStartX + rightDropLen, 0]
], 0.65, 0, floorY, backLineZ, birchSide);
box(park, rightDropStartX - 0.37, floorY + backPlatH + 0.245, backLineZ, 0.76, 0.025, 0.67, darkMetal);

// (3) 靠內側 (-Z 側)：6階樓梯 + 下斜圓管扶手 (寬 2.10)
const innerStairW = 2.10;
const innerStairZ = backLineZ - backLineW/2 + innerStairW/2;
for(let s=0; s<6; s++){
  const stepW = rightDropLen / 6;
  const stepH = backPlatH * (6 - s) / 6;

function buildRightQuarterPipe(parent, rightEdgeX, centerZ, lengthZ, depthX, heightY, deckDepth=0.85){
  const shape = new THREE.Shape();
  const r = Math.min(depthX, heightY);
  shape.moveTo(0, 0);
  shape.lineTo(depthX + deckDepth, 0);
  shape.lineTo(depthX + deckDepth, heightY);
  shape.lineTo(depthX, heightY);
  shape.absarc(0, r, r, 0, -Math.PI/2, true);
  shape.closePath();

  const geo = new THREE.ExtrudeGeometry(shape, { depth: lengthZ, bevelEnabled: false, curveSegments: 22 });
  geo.translate(0, 0, -lengthZ/2);

  const startX = rightEdgeX - (depthX + deckDepth);
  const mesh = new THREE.Mesh(geo, birchRamp);
  mesh.position.set(startX, floorY, centerZ);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);

  const coping = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, lengthZ, 14), darkMetal);
  coping.rotation.x = Math.PI/2;
  coping.position.set(startX + depthX, floorY + heightY, centerZ);
  parent.add(coping);

  box(parent, startX + 0.12, floorY + 0.012, centerZ, 0.28, 0.02, lengthZ, steelPlate);
}

// GTANK 招牌懸浮於內側長條高台上方（載入自訂 Logo 圖片並自動去背加圓角框）
function createCustomLogoSprite(imgUrl) {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  const ctx = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;

  const img = new Image();
  img.onload = () => {
    // 1. 畫出圓角白底看板（讓黑色 TSK8 與灰色立體陰影清晰呈現）
    ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
    ctx.beginPath();
    ctx.roundRect(16, 16, 480, 480, 64);
    ctx.fill();

    // 2. 加上品牌金色外框，與場景熱點風格統一
    ctx.strokeStyle = '#ffd36a';
    ctx.lineWidth = 12;
    ctx.stroke();

    // 3. 將上傳的 Logo 置中繪製進看板內
    ctx.drawImage(img, 56, 56, 400, 400);
    tex.needsUpdate = true;
  };
  img.src = imgUrl;

  const sprite = new THREE.Sprite(
    new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false })
  );
  // 因為圖片是正方形比例，scale 設為 1:1（例如 2.6 x 2.6）才不會變形
  sprite.scale.set(2.6, 2.6, 1);
  return sprite;
}

function createGtSkater() {
  const skaterRoot = new THREE.Group();

  // 1. 滑板群組 (獨立群組，方便在空中做 Shuvit 旋轉)

  const gripMat = mat(0x222629, 0.9);
  box(boardGroup, 0, 0.08, 0, 0.52, 0.025, 0.16, deckMat);
  box(boardGroup, 0, 0.095, 0, 0.50, 0.008, 0.15, gripMat);
  // 翹起的 Nose 與 Tail
  const nose = box(boardGroup, 0.30, 0.105, 0, 0.12, 0.022, 0.15, deckMat);
  nose.rotation.z = 0.32;
  const tail = box(boardGroup, -0.30, 0.105, 0, 0.12, 0.022, 0.15, deckMat);
  tail.rotation.z = -0.32;

  // 輪架 (Trucks) 與 4顆白色滑板輪
  for (const tx of [-0.18, 0.18]) {
    box(boardGroup, tx, 0.055, 0, 0.04, 0.03, 0.14, steelPlate);
    for (const tz of [-0.085, 0.085]) {
      const wheel = cylinder(boardGroup, tx, 0.032, tz, 0.032, 0.032, 0.024, white, 12);
      wheel.rotation.x = Math.PI / 2;
    }
  }

  // 2. 小朋友人物群組 (側身站姿，面朝 +Z 前方)
  const kidGroup = new THREE.Group();
  kidGroup.position.y = 0.10;
  skaterRoot.add(kidGroup);

  const skinMat = mat(0xf5c6a5, 0.65);
  const shirtMat = mat(0x22282d, 0.8);     // 黑色 GTANK 練習短袖
  const shortsMat = mat(0x8c969e, 0.8);    // 灰色短褲
  const helmetMat = mat(0x2980b9, 0.35);   // 藍色安全帽
  const padMat = mat(0x1e2226, 0.7);       // 黑色護膝/護肘

  // 雙腳與膝蓋護具 (前後開立踩在板面上)
  for (const lx of [-0.14, 0.14]) {
    cylinder(kidGroup, lx, 0.16, 0, 0.042, 0.038, 0.28, skinMat, 10);
    // 護膝
    box(kidGroup, lx, 0.17, 0.02, 0.085, 0.08, 0.085, padMat);
    // 滑板鞋
    box(kidGroup, lx, 0.025, 0.015, 0.09, 0.05, 0.12, white);
  }

  // 短褲與上身軀幹
  box(kidGroup, 0, 0.34, 0, 0.24, 0.14, 0.14, shortsMat);
  box(kidGroup, 0, 0.52, 0, 0.26, 0.24, 0.15, shirtMat);

  // 頭部與藍色安全帽
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.115, 16, 16), skinMat);
  head.position.set(0, 0.75, 0.01);
  head.castShadow = true;
  kidGroup.add(head);

  const helmet = new THREE.Mesh(
    new THREE.SphereGeometry(0.128, 16, 14, 0, Math.PI * 2, 0, Math.PI * 0.62),
    helmetMat
  );
  helmet.position.set(0, 0.76, 0);
  helmet.castShadow = true;
  kidGroup.add(helmet);

  // 雙手張開保持平衡 (可隨招式動態上下擺動)
  const leftArm = new THREE.Group();
  leftArm.position.set(-0.15, 0.60, 0);
  const lArmMesh = box(leftArm, -0.11, -0.02, 0, 0.22, 0.055, 0.055, skinMat);
  lArmMesh.rotation.z = 0.35;
  box(leftArm, -0.10, -0.02, 0, 0.07, 0.065, 0.065, padMat); // 護肘
  kidGroup.add(leftArm);

  const rightArm = new THREE.Group();
  rightArm.position.set(0.15, 0.60, 0);
  const rArmMesh = box(rightArm, 0.11, -0.02, 0, 0.22, 0.055, 0.055, skinMat);

  box(rightArm, 0.10, -0.02, 0, 0.07, 0.065, 0.065, padMat); // 護肘
  kidGroup.add(rightArm);

  return { root: skaterRoot, board: boardGroup, kid: kidGroup, leftArm, rightArm };
}

const skateCurve = new THREE.CatmullRomCurve3(routePoints, true, 'catmullrom', 0.25);

function updateSkaterAnimation(elapsedTime) {
  const cycleDuration = 11.0;
  const u = (elapsedTime % cycleDuration) / cycleDuration;

  const pos = skateCurve.getPointAt(u);
  const tangent = skateCurve.getTangentAt(u).normalize();

  // 計算水平前進方向與斜坡仰角
  const heading = Math.atan2(-tangent.z, tangent.x);
  const horizLen = Math.hypot(tangent.x, tangent.z);
  const pitch = Math.atan2(tangent.y, horizLen);

  // --- 招式觸發判定 (改用實際 X 座標位置觸發，精準對應斜坡頂端！) ---
  let jumpOffsetY = 0;
  let boardSpinY = 0;
  let boardFlipZ = 0;
  let crouchOffset = 0;
  let armSwing = Math.sin(elapsedTime * 6) * 0.12;

  const isGoingLeft = tangent.x < -0.1;  // 去程：從右往左滑
  const isGoingRight = tangent.x > 0.1;  // 回程：從左往右滑

  // 招式 1：去程衝上右側斜坡、快到平台頂端 (x: 2.15 -> 0.40) -> Pop Shuvit 360° 豚跳
  if (isGoingLeft && pos.x <= 2.15 && pos.x >= 0.40) {
    const p = (2.15 - pos.x) / (2.15 - 0.40); // 0 -> 1 跳躍進度
    jumpOffsetY = Math.sin(p * Math.PI) * 0.58;
    boardSpinY = p * Math.PI * 2;
    boardFlipZ = Math.sin(p * Math.PI) * 0.28;
    crouchOffset = -Math.sin(p * Math.PI) * 0.06;
    armSwing = Math.sin(p * Math.PI) * 0.55;
  }
  // 招式 2：回程衝上左側斜坡、快到平台頂端 (x: 0.25 -> 2.00) -> 高飛 Ollie 豚跳！
  else if (isGoingRight && pos.x >= 0.25 && pos.x <= 2.00) {
    const p = (pos.x - 0.25) / (2.00 - 0.25); // 0 -> 1 跳躍進度
    jumpOffsetY = Math.sin(p * Math.PI) * 0.68;
    boardFlipZ = Math.sin(p * Math.PI * 2) * 0.32;
    crouchOffset = -Math.sin(p * Math.PI) * 0.08;
    armSwing = Math.sin(p * Math.PI) * 0.65;
  }
  // 衝上斜坡中段準備起跳前、以及落地後的膝蓋微蹲蓄力/緩衝
  else if (
    (isGoingLeft && ((pos.x > 2.15 && pos.x < 2.75) || (pos.x < 0.40 && pos.x > -0.20))) ||
    (isGoingRight && ((pos.x > -0.45 && pos.x < 0.25) || (pos.x > 2.00 && pos.x < 2.60)))
  ) {
    crouchOffset = -0.05;
  }

  // 套用位置與朝向
  skater.root.position.set(pos.x, pos.y + jumpOffsetY, pos.z);
  skater.root.rotation.set(0, 0, 0);
  skater.root.rotateY(heading);
  const activePitch = jumpOffsetY > 0.05 ? pitch * (1 - jumpOffsetY) : pitch;
  skater.root.rotateZ(activePitch);

  // 套用招式細節動畫
  skater.board.rotation.y = boardSpinY;
  skater.board.rotation.z = boardFlipZ;
  skater.kid.position.y = 0.10 + crouchOffset;
  skater.leftArm.rotation.z = armSwing;
  skater.rightArm.rotation.z = -armSwing;
}

function makeBuildingIsland(key,x,z,color,title,tag,desc,type){
 const g=islandBase(world,x,z,3.25,2.75,.35,color);g.userData.worldKey=key;floaters.push({obj:g,base:0,amp:.14,speed:.9,phase:x*.3});
 const b=new THREE.Group();g.add(b);
 if(type==='trophy'){
  box(b,0,.8,0,1.6,.35,1.2,mat(0xe7c66b));
  const cup=new THREE.Mesh(new THREE.CylinderGeometry(.55,.35,.75,24,1,true),mat(0xffd34e,.28));cup.position.y=1.45;b.add(cup);
  const h1=new THREE.Mesh(new THREE.TorusGeometry(.32,.09,10,24,Math.PI),mat(0xffd34e));h1.position.set(-.48,1.48,0);h1.rotation.z=Math.PI/2;b.add(h1);
  const h2=h1.clone();h2.position.x=.48;h2.rotation.z=-Math.PI/2;b.add(h2);
 } else if(type==='shop'){
  box(b,0,1.1,0,2.1,1.8,1.8,mat(0xe7a15b));box(b,0,2.15,0,2.4,.25,2.1,mat(0x34434a));
  box(b,0,1.0,.94,1.0,1.25,.08,mat(0x6ec6cf));
  for(let i=0;i<3;i++)box(b,-.55+i*.55,.65,1.02,.38,.08,.08,mat(0xffdf8a));
 } else if(type==='computer'){
  box(b,0,.75,0,2.0,.25,1.4,mat(0x5b6875));
  box(b,0,1.55,-.15,1.45,1.05,.12,mat(0x273a4a));
  box(b,0,1.55,-.07,1.25,.82,.035,mat(0x39c5d8,.3));
  box(b,0,.95,.25,.55,.12,.6,mat(0x303b40));
 } else if(type==='school'){
  box(b,0,1.0,0,2.1,1.5,1.8,mat(0xf1d9a5));
  const roof=new THREE.Mesh(new THREE.ConeGeometry(1.65,.9,4),mat(0x4c7777));roof.position.y=2.15;roof.rotation.y=Math.PI/4;b.add(roof);
  box(b,0,.8,.94,.65,1.1,.08,mat(0x6b9da1));
 } else {
  cylinder(b,0,1.3,0,.8,.55,1.8,mat(0xd8e1df),24);
  const top=new THREE.Mesh(new THREE.ConeGeometry(1.05,.8,24),mat(0xe4a35b));top.position.y=2.55;b.add(top);
  box(b,0,2.0,0,1.5,.12,1.5,mat(0x43535a));
 }
 //const spr=labelSprite(title,'#ffffff');spr.position.set(0,3.2,0);spr.scale.set(3.5,.88,1);g.add(spr);
 addHotspot(g,0,2.5,0,title,tag,desc,0xffd36a);
 return g;
}

const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
const info=document.querySelector('#info');
const data={
 main:['GTANK SKATEPARK','走進 GTANK 的真實滑板場。探索 Street 障礙、斜坡、滑軌與不同程度的練習空間。'],
 school:['滑板課程與分級','從初學者到進階技巧，查看課程內容、分級制度、收費與上課時間。'],

function showInfo(key,tag='GTANK WORLD',customTitle=null,customDesc=null){
  const d=data[key]||['探索 GTANK','更多資訊即將開放。'];
  document.querySelector('#infoTag').textContent=tag;
  document.querySelector('#infoTitle').textContent=customTitle||d[0];
  document.querySelector('#infoText').textContent=customDesc||d[1];
  info.classList.add('show');
}
function focus(key){
 const poses={main:[16,17,22,0,1,0],school:[19,13,19,14,0,10],events:[-12,10,15,-15,0,-10],shop:[25,12,13,14,0,-10],creative:[-23,12,14,-15,0,10],news:[0,13,-28,0,0,-17]};
 const p=poses[key];if(!p)return;
 const startP=camera.position.clone(),endP=new THREE.Vector3(p[0],p[1],p[2]),startT=controls.target.clone(),endT=new THREE.Vector3(p[3],p[4],p[5]);
 let t=0;function step(){t=Math.min(1,t+.025);const e=1-Math.pow(1-t,3);camera.position.lerpVectors(startP,endP,e);controls.target.lerpVectors(startT,endT,e);if(t<1)requestAnimationFrame(step)}step();
 showInfo(key,key==='main'?'MAIN ISLAND':'GTANK DESTINATION');
}
renderer.domElement.addEventListener('pointerdown',e=>{
  mouse.x=e.clientX/innerWidth*2-1;
  mouse.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(pickables,true);
  if(hits.length){
    let o=hits[0].object;
    while(o&&!o.userData.title)o=o.parent;
    if(o?.userData.title){
      const match=Object.entries(data).find(([k,v])=>v[0]===o.userData.title);
      if(match)focus(match[0]);
      else showInfo('main',o.userData.tag,o.userData.title,o.userData.desc);
    }
  }
});
document.querySelectorAll('nav button[data-target]').forEach(b=>b.addEventListener('click',()=>focus(b.dataset.target)));
document.querySelector('#close').onclick=()=>info.classList.remove('show');
document.querySelector('#infoAction').onclick=()=>{info.classList.remove('show');};

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  for(const f of floaters){
    f.obj.position.y=f.base+Math.sin(t*f.speed+f.phase)*f.amp;
  }
  updateSkaterAnimation(t); // <--- 加入這一行，啟動 GTANK 小滑手巡航與招式！
  controls.update();
  renderer.render(scene,camera)
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
setTimeout(()=>document.querySelector('#loading').classList.add('hide'),900);
